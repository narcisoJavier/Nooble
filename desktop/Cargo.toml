[package]
name = "gooblelab"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A native notebook builder for MiniMax H3 on Google Colab"
license = "MIT"
repository = "https://github.com/narcisoJavier/Nooble"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
percent-encoding = "2"
webbrowser = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
lto = "thin"
